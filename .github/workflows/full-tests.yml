name: DrumMaster AI Full Tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - ".github/workflows/full-tests.yml"
  workflow_dispatch:

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ubuntu24-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser + deps
        timeout-minutes: 15
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx --no-install playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Browser setup failed on attempt $attempt; retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "Browser setup failed after three attempts. Tests have not been skipped."
          exit 1

      - name: Run unit tests
        run: npm run test:unit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build app
        run: npm run build
