name: DrumMaster AI Full Tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - ".github/workflows/full-tests.yml"
  workflow_dispatch:

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled Playwright browser
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = require('@playwright/test/package.json').version;
          if (version !== '1.64.1') {
            throw new Error('Update the workflow container tag and version check to match the Playwright version in package-lock.json.');
          }
          const { chromium } = require('playwright');
          if (!fs.existsSync(chromium.executablePath())) {
            throw new Error('Bundled Chromium is missing. Browser tests have not been skipped.');
          }
          console.log('Matching Playwright version and bundled Chromium verified.');
          NODE

      - name: Run unit tests
        run: npm run test:unit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build app
        run: npm run build
